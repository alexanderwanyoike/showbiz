name: GitHub Pages

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "site/**"
      - "scripts/verify-website.sh"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/verify-website.sh"
      - ".github/workflows/pages.yml"
  # Redeploy when a release is published so the page follows the newest
  # version without a commit.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let a queued one finish rather than
# cancelling it: a half-applied Pages deploy is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site
        run: ./scripts/verify-website.sh

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Stage the site with the current release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The newest published, non-draft release. Release assets are
          # named from the version, so this is what the download links
          # must point at.
          release=$(gh release view --repo "$GITHUB_REPOSITORY" \
            --json tagName,publishedAt,assets)

          tag=$(jq -r '.tagName' <<<"$release")
          published=$(jq -r '.publishedAt' <<<"$release")
          assets=$(jq -r '.assets | length' <<<"$release")

          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::No published release found; refusing to deploy a page with placeholder links."
            exit 1
          fi
          if [ "$assets" -eq 0 ]; then
            echo "::error::Release $tag has no assets; every download link would 404."
            exit 1
          fi

          # Tags are vX.Y.Z while asset names use X.Y.Z, so both forms
          # are substituted.
          num=${tag#v}
          expected_assets=(
            "Showbiz-$num.AppImage"
            "showbiz_${num}_amd64.deb"
            "Showbiz-$num-arm64.dmg"
            "Showbiz.Setup.$num.exe"
          )
          for asset in "${expected_assets[@]}"; do
            if ! jq -e --arg asset "$asset" '.assets[] | select(.name == $asset)' \
              <<<"$release" >/dev/null; then
              echo "::error::Release $tag is missing $asset"
              exit 1
            fi
          done

          date_human=$(date -u -d "$published" '+%-d %B %Y')
          echo "Publishing site for $tag ($date_human, $assets assets)"

          mkdir -p _site
          cp -R site/. _site/
          sed -i "s|__VERSION__|${tag}|g; s|__VERSION_NUM__|${num}|g; s|__RELEASE_DATE__|${date_human}|g" \
            _site/index.html

          # A surviving placeholder means a rename broke the substitution
          # and would ship literal __VERSION__ text to users.
          if grep -R -q '__VERSION__\|__VERSION_NUM__\|__RELEASE_DATE__' _site; then
            echo "::error::Release placeholder left in staged website"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
